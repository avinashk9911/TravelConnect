server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — redirect all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend services
    location /api/ {
        proxy_pass http://booking-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /traveler-api/ {
        rewrite ^/traveler-api/(.*) /api/$1 break;
        proxy_pass http://traveler-service:8081;
        proxy_set_header Host $host;
    }

    location /integration-api/ {
        rewrite ^/integration-api/(.*) /api/$1 break;
        proxy_pass http://integration-service:8083;
        proxy_set_header Host $host;
    }
}
