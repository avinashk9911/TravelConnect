server:
  port: 8083

spring:
  application:
    name: integration-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelconnect}
    username: ${DB_USERNAME:travelconnect}
    password: ${DB_PASSWORD:travelconnect}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: IntegrationServicePool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:travelconnect}
    password: ${RABBITMQ_PASSWORD:travelconnect}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000   # 2 s before first retry
          max-attempts: 3
          multiplier: 2.0           # 2 s, 4 s, 8 s
        default-requeue-rejected: false

# ── Supplier endpoints ────────────────────────────────────────────────────────
# Defaults point to localhost for local development.
# Override with environment variables in Docker / Kubernetes.
suppliers:
  flight:
    url: ${FLIGHT_SUPPLIER_URL:http://localhost:9001}
  hotel:
    url: ${HOTEL_SUPPLIER_URL:http://localhost:9002}
  car:
    url: ${CAR_SUPPLIER_URL:http://localhost:9003}

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.travelconnect: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name}] %logger{36} - %msg%n"
