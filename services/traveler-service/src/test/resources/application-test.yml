spring:
  # In unit/slice tests we override these to avoid needing a real DB.
  # Integration tests use Testcontainers which starts a real PostgreSQL
  # container and overrides the datasource URL programmatically.
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    # Disable Flyway for slice tests — we let Hibernate create the schema instead
    enabled: false

logging:
  level:
    com.travelconnect: DEBUG
    org.hibernate.SQL: DEBUG
