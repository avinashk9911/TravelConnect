server:
  port: 8082

spring:
  application:
    name: booking-service

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    # ${VAR:default} syntax: reads env var VAR, falls back to 'default' if not set.
    # This means: production passes real values via env vars; local dev uses defaults.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelconnect}
    username: ${DB_USERNAME:travelconnect}
    password: ${DB_PASSWORD:travelconnect}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: BookingServicePool

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      # validate: Hibernate checks the schema matches the entities but does NOT modify it.
      # Flyway manages the schema — never let Hibernate create or drop tables in production.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway (database migrations) ──────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:travelconnect}
    password: ${RABBITMQ_PASSWORD:travelconnect}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false

# ── Spring Actuator ───────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.travelconnect: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name}] %logger{36} - %msg%n"
